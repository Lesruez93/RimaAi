[project]
name = "rimaai-backend"
version = "0.1.0"
description = "RimaAI FastAPI backend — smart farming companion for Zimbabwean farmers"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/File()/Form() in defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Curated trilingual advice / seeded reference tables are naturally wide; keeping
# each entry on one line is more readable than wrapping data strings.
"app/services/knowledge.py" = ["E501"]
"app/services/forecast.py" = ["E501"]
"app/seed.py" = ["E501"]
