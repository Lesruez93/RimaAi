<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RimaAI USSD Simulator</title>
  <style>
    :root { --green:#2e7d32; --dark:#1b5e20; --bg:#f4f6f4; }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin:0; background:var(--bg); display:flex; min-height:100vh;
           align-items:center; justify-content:center; padding:1rem; }
    .phone { width:320px; background:#111; border-radius:32px; padding:18px;
             box-shadow:0 12px 40px rgba(0,0,0,.35); }
    .screen { background:#0b0b0b; color:#d7ffd7; font-family:ui-monospace,monospace;
              min-height:230px; border-radius:12px; padding:14px; font-size:14px;
              white-space:pre-wrap; line-height:1.45; }
    .title { color:#8bc34a; font-weight:700; margin-bottom:8px; }
    .row { display:flex; gap:8px; margin-top:12px; }
    input { flex:1; padding:10px; border-radius:10px; border:none; font-size:15px; }
    button { padding:10px 14px; border:none; border-radius:10px; background:var(--green);
             color:#fff; font-weight:600; cursor:pointer; }
    button.secondary { background:#444; }
    .hint { color:#9e9e9e; font-size:11px; margin-top:10px; text-align:center; }
    .config { max-width:320px; margin-top:14px; font-size:12px; color:#555; }
    .config input { padding:6px; font-size:12px; }
  </style>
</head>
<body>
  <div>
    <div class="phone">
      <div class="screen" id="screen"><span class="title">RimaAI USSD Simulator</span>
Dial *123# and press Send to begin.</div>
      <div class="row">
        <input id="entry" placeholder="Type reply, e.g. *123# then 1" autocomplete="off" />
      </div>
      <div class="row">
        <button id="send">Send</button>
        <button id="reset" class="secondary">Reset</button>
      </div>
      <div class="hint">Feature-phone flow — no data connection required in the field.</div>
    </div>
    <div class="config">
      Backend: <input id="base" value="https://rimaai-backend-943314742820.us-central1.run.app" style="width:220px" />
      &nbsp;Phone: <input id="phone" value="+263771234567" style="width:120px" />
    </div>
  </div>

  <script>
    // Accumulated USSD "text" (the *-joined inputs the telco would forward).
    let sessionText = "";
    let started = false;

    const screen = document.getElementById("screen");
    const entry = document.getElementById("entry");

    function render(text, ended) {
      screen.textContent = text;
      if (ended) { started = false; sessionText = ""; }
    }

    async function post() {
      const base = document.getElementById("base").value.replace(/\/$/, "");
      const phone = document.getElementById("phone").value;
      const body = new URLSearchParams({
        phoneNumber: phone, text: sessionText, sessionId: "sim-1", serviceCode: "*123#",
      });
      try {
        const res = await fetch(base + "/ussd", { method: "POST", body });
        const raw = await res.text();
        const ended = raw.startsWith("END");
        render(raw.replace(/^(CON|END)\s?/, ""), ended);
      } catch (e) {
        render("Network error — is the backend running on " +
               document.getElementById("base").value + " ?\n\n" + e, true);
      }
    }

    function handleInput(value) {
      const v = value.trim();
      if (!started) {
        // Expect the user to "dial" the code first.
        if (v.replace(/\s/g, "") !== "*123#") {
          render("Dial *123# to start the RimaAI menu.", false);
          return;
        }
        started = true;
        sessionText = "";
      } else {
        sessionText = sessionText ? sessionText + "*" + v : v;
      }
      post();
    }

    document.getElementById("send").onclick = () => {
      handleInput(entry.value);
      entry.value = "";
    };
    entry.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("send").click();
    });
    document.getElementById("reset").onclick = () => {
      started = false; sessionText = "";
      render("Dial *123# and press Send to begin.", false);
    };
  </script>
</body>
</html>
